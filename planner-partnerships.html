<script>const translations={"en":{"nav":"PRIVATE PLANNER PARTNERSHIPS","eyebrow":"LIA ARMONÍA / A PRIVATE INVITATION","hero":"Your next client.<br><em>Our introduction.</em>","heroDesc":"We’re building a curated Wedding Planner Edit to showcase exceptional local studios to international couples. They can discover your work by destination and request an introduction through LIA ARMONÍA. You lead the planning and client relationship; our creative design services are entirely optional.","cta":"Explore the opportunity ↓","strip":"INTERNATIONAL COUPLES · LOCAL EXPERTISE · DESIGN-LED PARTNERSHIPS","s1n":"01 / THE OPPORTUNITY","s1":"The right couple.<br><em>The right planner.</em>","s1p":"LIA ARMONÍA receives enquiries from couples in the United States and beyond who are planning destination weddings in Europe and other remarkable places. Some projects involve substantial six-figure overall budgets. We look for experienced local planners who can guide these couples through planning and production.","s1sub":"Every introduction is considered individually, according to destination, project needs, style and budget. Enquiries are not guaranteed bookings.","stat1":"U.S. & GLOBAL","stat1b":"Destination wedding enquiries","stat2":"LOCAL PLANNERS","stat2b":"Expertise at the destination","stat3":"SELECTIVE","stat3b":"Personal, qualified introductions","s2n":"03 / HOW WE WORK TOGETHER","s2":"We imagine.<br><em>You bring it to life.</em>","s2p":"LIA ARMONÍA develops the creative direction: an architecture-led wedding concept, spatial design, mood and realistic venue-specific visualizations. We give couples a clear picture of their celebration before it happens.","s2p2":"When a local partner is involved, we share the agreed design direction and collaborate as needed. You bring your on-the-ground knowledge, refine the concept for what is feasible at the venue, coordinate local suppliers and manage planning and execution. The couple's vision remains central — practical adaptations happen together, never as a promise of an identical real-life result.","role1":"LIA ARMONÍA","role1b":"Creative direction · Spatial concepts · Visualization","role2":"LOCAL PLANNER","role2b":"Feasibility · Venue coordination · Vendors · Execution","role3":"TOGETHER","role3b":"One aligned design, adapted to the real space","s3n":"04 / BEYOND YOUR PROFILE","s3":"More visibility.<br><em>More opportunities.</em>","p1":"Personal client introductions","p1b":"When a couple discovers or requests your studio through our Planner Edit, LIA ARMONÍA reviews the enquiry and can introduce you directly with the couple’s permission. You set your planning fees, own the client relationship and decide which weddings to accept.","p2":"Optional design support at partner rates","p2b":"Only if you wish, we can create wedding concepts, venue-specific visualizations and creative direction for your own clients at preferential partner prices. These design services are entirely optional, quoted separately and never required for a listing or referral.","s4n":"05 / THE COMMERCIAL OPPORTUNITY","s4":"A fee for<br><em>results.</em>","rateLabel":"PROPOSED REFERRAL COMMISSION / PLANNING FEES","s4p":"For a new client personally introduced by LIA ARMONÍA who books your planning services, our proposed referral commission is 15% of the net planning fees actually received by your studio — not 15% of the total wedding budget. Venue fees, third-party suppliers, taxes and pass-through costs are excluded.","s4small":"No upfront joining fee. Non-exclusive collaboration. Referral eligibility, attribution, payment timing and any required client disclosures are agreed in writing beforehand; terms are subject to applicable local rules. No guaranteed bookings or lead volume.","s5n":"06 / YOUR INVITATION","s5":"Let's build something<br><em>remarkable.</em>","s5p":"I'd love to explore featuring your studio in our founding collection. If you're interested, simply send me your best email address. I will personally send your profile submission link, our information checklist, the planned January 15 launch schedule and the next steps for a possible referral partnership. You can review and approve your editorial profile before it appears publicly. Any design services are optional.","mail":"Discuss a partnership ↗","foot":"A PRIVATE PARTNER INVITATION · LIA ARMONÍA","alt":"LIA ARMONÍA original architectural wedding design concept, not a photographed client event.","portalN":"02 / YOUR EDITORIAL FEATURE","portalTitle":"Your work.<br><em>In the spotlight.</em>","portalBody":"Your studio can be showcased in our curated Wedding Planner Collection alongside our Venue Edit. Couples can discover and compare approved planners by country, region, planning expertise and language, then request an introduction through LIA ARMONÍA. This is an opportunity to reach international couples actively looking for local professionals.","portalBody2":"You decide what you want to share — your studio story, areas served, planning services, portfolio images, optional indicative pricing and independently verifiable client reviews. We edit everything into one coherent, beautiful presentation and send your profile for approval before publishing.","portalNote":"Founding Collection launch: 15 January 2027. We are gathering profiles now, with editorial review and individual approval before the shared launch. No listing fee. Your materials remain private until approved, and client introductions follow a separate success-based referral agreement.","portalLink":"Preview the Planner Edit ↗"},"de":{"nav":"PRIVATE PLANNER-PARTNERSCHAFTEN","eyebrow":"LIA ARMONÍA / PERSÖNLICHE EINLADUNG","hero":"Ihr nächster Kunde.<br><em>Unsere Vermittlung.</em>","heroDesc":"Wir bauen eine kuratierte Wedding Planner Collection auf, in der wir ausgewählte lokale Planungsstudios internationalen Hochzeitspaaren präsentieren. Kunden können Sie nach Destination entdecken und über LIA ARMONÍA anfragen. Die Planung und Kundenbeziehung übernehmen Sie; unsere Designleistungen sind vollkommen optional.","cta":"Partnerschaft entdecken ↓","strip":"INTERNATIONALE PAARE · LOKALE EXPERTISE · DESIGNPARTNERSCHAFTEN","s1n":"01 / DIE CHANCE","s1":"Das richtige Paar.<br><em>Der richtige Planner.</em>","s1p":"LIA ARMONÍA erhält Anfragen von Paaren aus den USA und anderen Ländern, die Hochzeiten in Europa und weiteren Destinationen planen. Manche Projekte haben ein sechsstelliges Gesamtbudget. Dafür suchen wir erfahrene lokale Planner, die Planung und Umsetzung professionell begleiten.","s1sub":"Jede Vermittlung erfolgt individuell nach Destination, Anforderungen, Stil und Budget. Anfragen sind keine garantierten Buchungen.","stat1":"USA & WELTWEIT","stat1b":"Anfragen für Destination Weddings","stat2":"LOKALE PLANNER","stat2b":"Expertise direkt vor Ort","stat3":"AUSGEWÄHLT","stat3b":"Persönliche passende Vermittlungen","s2n":"03 / UNSERE ZUSAMMENARBEIT","s2":"Wir entwerfen.<br><em>Sie setzen um.</em>","s2p":"LIA ARMONÍA entwickelt die kreative Richtung: architekturbezogene Hochzeitskonzepte, Raumgestaltung, Mood und realistische Visualisierungen für die gewählte Venue. So können Paare ihre Feier frühzeitig erleben.","s2p2":"Mit einem lokalen Partner stimmen wir die Designvision ab. Sie prüfen die praktische Machbarkeit, passen Details in Abstimmung mit uns an, koordinieren lokale Dienstleister und verantworten Planung und Umsetzung. Es geht nicht um eine Garantie, dass Visualisierungen eins zu eins realisierbar sind.","role1":"LIA ARMONÍA","role1b":"Creative Direction · Raumkonzepte · Visualisierung","role2":"LOKALER PLANNER","role2b":"Machbarkeit · Venue · Dienstleister · Umsetzung","role3":"GEMEINSAM","role3b":"Ein stimmiges Design, das vor Ort funktioniert","s3n":"04 / MEHR ALS EIN PROFIL","s3":"Mehr Sichtbarkeit.<br><em>Mehr Möglichkeiten.</em>","p1":"Persönliche Kundenvermittlung","p1b":"Wenn ein Paar Ihr Studio im Planner Edit entdeckt oder anfragt, prüfen wir die Anfrage und stellen Sie mit Zustimmung des Paars direkt vor. Sie bestimmen Ihre Preise, betreuen Ihre Kunden und entscheiden selbst über jede Buchung.","p2":"Optionale Designleistungen zu Partnerpreisen","p2b":"Nur auf Wunsch entwickeln wir Hochzeitskonzepte, Venue-Visualisierungen und Creative Direction für Ihre eigenen Kunden zu vergünstigten Partnerkonditionen. Diese Leistungen sind freiwillig, werden separat angeboten und sind keine Voraussetzung für Profil oder Vermittlung.","s4n":"05 / DAS PARTNERSCHAFTSMODELL","s4":"Provision nur<br><em>bei Erfolg.</em>","rateLabel":"VORGESCHLAGENE VERMITTLUNGSPROVISION / PLANUNGSHONORAR","s4p":"Bei einem neuen, durch LIA ARMONÍA vermittelten Kunden, der Ihre Planungsleistungen bucht, schlagen wir 15 % des tatsächlich vereinnahmten Netto-Planungshonorars vor – ausdrücklich nicht des gesamten Hochzeitsbudgets. Venue-Kosten, externe Dienstleister, Steuern und durchlaufende Posten sind ausgenommen.","s4small":"Keine Aufnahmegebühr. Keine Exklusivität. Vermittlung, Nachweis, Zahlung und erforderliche Offenlegung werden vorab schriftlich und im Einklang mit den jeweiligen rechtlichen Vorgaben geregelt. Keine garantierten Buchungen.","s5n":"06 / PERSÖNLICHE EINLADUNG","s5":"Lassen Sie uns<br><em>etwas bewegen.</em>","s5p":"Ich würde Ihr Studio sehr gerne für unsere erste Collection berücksichtigen. Bei Interesse senden Sie mir einfach Ihre E-Mail-Adresse. Ich schicke Ihnen persönlich den Link zur Profileinreichung, unsere Unterlagenliste, den Launch-Plan zum 15. Januar und die nächsten Schritte für eine mögliche Vermittlungspartnerschaft. Vor der Veröffentlichung erhalten Sie Ihr Editorial-Profil zur Freigabe. Designleistungen sind optional.","mail":"Partnerschaft besprechen ↗","foot":"PRIVATE PARTNERSCHAFTSEINLADUNG · LIA ARMONÍA","alt":"Architektonisches Designkonzept von LIA ARMONÍA, keine Fotografie eines realen Events.","portalN":"02 / IHR EDITORIAL-PROFIL","portalTitle":"Ihre Arbeit.<br><em>Im Mittelpunkt.</em>","portalBody":"Ihr Studio kann in unserer kuratierten Wedding Planner Collection neben dem Venue Edit vorgestellt werden. Paare entdecken und vergleichen freigegebene Planner nach Ländern, Regionen, Leistungen und Sprachen und können eine Vermittlung über LIA ARMONÍA anfragen. So erreichen Sie internationale Paare, die lokale Expertise suchen.","portalBody2":"Sie bestimmen selbst, welche Informationen Sie teilen – Ihre Story, Regionen, Leistungen, Portfolio-Bilder, optionale Preisangaben und unabhängig belegbare Bewertungen. Wir gestalten daraus ein hochwertiges, einheitliches Profil und holen vor der Veröffentlichung Ihre Freigabe ein.","portalNote":"Start der Founding Collection: 15. Januar 2027. Bis dahin sammeln und prüfen wir Profile und veröffentlichen sie erst nach individueller Freigabe. Keine Listing-Gebühr. Vermittlungen werden separat erfolgsabhängig vereinbart.","portalLink":"Planner Collection ansehen ↗"},"it":{"nav":"PARTNERSHIP PRIVATE PER WEDDING PLANNER","eyebrow":"LIA ARMONÍA / UN INVITO PERSONALE","hero":"Il vostro prossimo cliente.<br><em>La nostra presentazione.</em>","heroDesc":"Stiamo creando una Wedding Planner Edit per presentare studi locali selezionati a coppie internazionali. Potranno scoprire il vostro lavoro per destinazione e richiedere una presentazione tramite LIA ARMONÍA. Voi gestite pianificazione e clienti; il nostro supporto creativo è del tutto facoltativo.","cta":"Scopri l'opportunità ↓","strip":"COPPIE INTERNAZIONALI · COMPETENZA LOCALE · PARTNERSHIP CREATIVE","s1n":"01 / L'OPPORTUNITÀ","s1":"La coppia giusta.<br><em>Il planner giusto.</em>","s1p":"LIA ARMONÍA riceve richieste da coppie statunitensi e internazionali che organizzano matrimoni in Europa e altrove. Alcuni progetti prevedono budget complessivi a sei cifre. Cerchiamo wedding planner locali esperti per la pianificazione e la produzione.","s1sub":"Ogni presentazione viene valutata in base a destinazione, esigenze, stile e budget. Le richieste non garantiscono prenotazioni.","stat1":"USA & MONDO","stat1b":"Richieste per destination wedding","stat2":"WEDDING PLANNER LOCALI","stat2b":"Competenza sul territorio","stat3":"SELETTIVO","stat3b":"Presentazioni personali e mirate","s2n":"03 / COME COLLABORIAMO","s2":"Noi immaginiamo.<br><em>Voi realizzate.</em>","s2p":"LIA ARMONÍA crea la direzione artistica, il design degli spazi e visualizzazioni realistiche della location, per dare forma alla visione degli sposi.","s2p2":"I planner locali valutano la fattibilità, adattano con noi il progetto alle condizioni reali, coordinano i fornitori e gestiscono pianificazione e realizzazione. Le visualizzazioni non sono una promessa di riproduzione identica.","role1":"LIA ARMONÍA","role1b":"Direzione creativa · Design · Visualizzazione","role2":"PLANNER LOCALE","role2b":"Fattibilità · Location · Fornitori · Realizzazione","role3":"INSIEME","role3b":"Una visione condivisa e realizzabile","s3n":"04 / OLTRE IL PROFILO","s3":"Più visibilità.<br><em>Più opportunità.</em>","p1":"Segnalazioni personali di clienti","p1b":"Quando una coppia trova o richiede il vostro studio, valutiamo la richiesta e possiamo presentarvela con il consenso della coppia. Tariffe, rapporto con il cliente e decisioni restano vostri.","p2":"Design facoltativo a tariffe partner","p2b":"Solo su richiesta realizziamo concept, visualizzazioni e direzione creativa per i vostri clienti a condizioni preferenziali. Sono servizi completamente facoltativi, quotati separatamente e non necessari per comparire nel portale.","s4n":"05 / L'OPPORTUNITÀ COMMERCIALE","s4":"Una commissione<br><em>sui risultati.</em>","rateLabel":"COMMISSIONE PROPOSTA / COMPENSI DI PLANNING","s4p":"Per ogni nuovo cliente presentato da LIA ARMONÍA che prenota i vostri servizi di planning, proponiamo il 15% dei compensi netti effettivamente incassati dallo studio, non del budget totale del matrimonio. Sono esclusi location, fornitori esterni, imposte e spese anticipate per conto del cliente.","s4small":"Nessuna quota d'ingresso né esclusiva. Attribuzione, pagamento e comunicazioni richieste saranno definiti per iscritto, nel rispetto delle normative locali. Nessuna garanzia di prenotazioni.","s5n":"06 / IL VOSTRO INVITO","s5":"Creiamo qualcosa<br><em>di speciale.</em>","s5p":"Mi piacerebbe valutare il vostro studio per la prima selezione. Se siete interessati, inviatemi semplicemente il vostro indirizzo email: vi manderò personalmente il link per inviare il profilo, l'elenco dei materiali, il calendario del lancio del 15 gennaio e i prossimi passi. Potrete approvare il profilo prima della pubblicazione. I servizi di design sono facoltativi.","mail":"Parliamo di partnership ↗","foot":"INVITO PRIVATO · LIA ARMONÍA","alt":"Concept di wedding design di LIA ARMONÍA; non è una fotografia di un evento reale.","portalN":"02 / IL VOSTRO PROFILO EDITORIALE","portalTitle":"Il vostro lavoro.<br><em>In primo piano.</em>","portalBody":"Il vostro studio può essere presentato nella nostra Wedding Planner Collection accanto alla Venue Edit. Le coppie scoprono e confrontano planner approvati per paese, regione, servizi e lingue e possono richiedere un contatto tramite LIA ARMONÍA.","portalBody2":"Decidete voi cosa condividere: storia, destinazioni, servizi, portfolio, tariffe indicative facoltative e recensioni verificabili. Organizziamo tutto in un profilo editoriale uniforme e chiediamo l'approvazione prima della pubblicazione.","portalNote":"Lancio della Founding Collection: 15 gennaio 2027. Raccogliamo e revisioniamo i profili prima del lancio congiunto, sempre con approvazione individuale. Nessuna quota di pubblicazione. Le segnalazioni sono regolate da un accordo separato.","portalLink":"Scoprite la Planner Edit ↗"},"fr":{"nav":"PARTENARIATS PRIVÉS / WEDDING PLANNERS","eyebrow":"LIA ARMONÍA / INVITATION PRIVÉE","hero":"Votre prochain client.<br><em>Notre mise en relation.</em>","heroDesc":"Nous créons une sélection de wedding planners locaux afin de présenter leurs studios aux couples internationaux. Ils pourront découvrir votre travail par destination et demander une mise en relation via LIA ARMONÍA. Vous gérez les clients et l'organisation; nos services de design sont entièrement facultatifs.","cta":"Découvrir l'opportunité ↓","strip":"COUPLES INTERNATIONAUX · EXPERTISE LOCALE · PARTENARIATS CRÉATIFS","s1n":"01 / L'OPPORTUNITÉ","s1":"Le bon couple.<br><em>Le bon planner.</em>","s1p":"LIA ARMONÍA reçoit des demandes de couples américains et internationaux qui organisent des mariages en Europe et ailleurs. Certains projets disposent d'un budget global à six chiffres. Nous recherchons des wedding planners locaux expérimentés.","s1sub":"Chaque mise en relation dépend de la destination, des besoins, du style et du budget. Les demandes ne garantissent aucune réservation.","stat1":"ÉTATS-UNIS & MONDE","stat1b":"Demandes de mariages de destination","stat2":"PLANNERS LOCAUX","stat2b":"Expertise sur place","stat3":"SÉLECTIF","stat3b":"Mises en relation personnalisées","s2n":"03 / NOTRE COLLABORATION","s2":"Nous imaginons.<br><em>Vous réalisez.</em>","s2p":"LIA ARMONÍA conçoit la direction artistique, les espaces et des visualisations réalistes adaptées au lieu de réception afin de donner vie au projet des futurs mariés.","s2p2":"Le partenaire local vérifie la faisabilité, adapte les détails avec nous, coordonne les prestataires et dirige la planification et la réalisation. Les visualisations ne constituent pas une garantie de reproduction à l'identique.","role1":"LIA ARMONÍA","role1b":"Direction créative · Design · Visualisations","role2":"PLANNER LOCAL","role2b":"Faisabilité · Lieu · Prestataires · Réalisation","role3":"ENSEMBLE","role3b":"Une vision cohérente et réalisable","s3n":"04 / AU-DELÀ DU PROFIL","s3":"Plus de visibilité.<br><em>Plus d'opportunités.</em>","p1":"Mises en relation personnalisées","p1b":"Lorsqu'un couple découvre ou demande votre studio, nous étudions son projet et pouvons vous le présenter avec son accord. Vous gardez vos tarifs, la relation client et le choix des projets.","p2":"Design facultatif à tarifs partenaires","p2b":"Uniquement si vous le souhaitez, nous créons des concepts, des visualisations et une direction créative pour vos clients à tarifs préférentiels. Ces prestations sont facultatives, proposées séparément et jamais obligatoires pour figurer au portail.","s4n":"05 / LE MODÈLE COMMERCIAL","s4":"Une commission<br><em>au résultat.</em>","rateLabel":"COMMISSION PROPOSÉE / HONORAIRES DE PLANNING","s4p":"Pour un nouveau client présenté par LIA ARMONÍA qui réserve vos services, nous proposons 15 % des honoraires nets de planning effectivement encaissés, et non du budget total du mariage. Location, prestataires tiers, taxes et débours sont exclus.","s4small":"Aucun droit d'entrée, aucune exclusivité. Attribution, paiement et informations à communiquer seront convenus par écrit dans le respect des règles locales. Aucune réservation garantie.","s5n":"06 / VOTRE INVITATION","s5":"Créons quelque chose<br><em>d'exceptionnel.</em>","s5p":"Je serais ravie d'envisager votre studio pour notre première sélection. Si cela vous intéresse, envoyez-moi simplement votre adresse email : je vous transmettrai le lien de soumission, la liste des éléments nécessaires, notre calendrier de lancement du 15 janvier et les prochaines étapes. Vous validerez votre profil avant toute publication. Les services de design restent facultatifs.","mail":"Parlons partenariat ↗","foot":"INVITATION PRIVÉE · LIA ARMONÍA","alt":"Concept architectural créé par LIA ARMONÍA, et non photographie d'un mariage réel.","portalN":"02 / VOTRE PROFIL ÉDITORIAL","portalTitle":"Votre travail.<br><em>À l'honneur.</em>","portalBody":"Votre studio peut figurer dans notre Wedding Planner Collection aux côtés de la Venue Edit. Les couples découvrent et comparent des planners approuvés par pays, région, prestations et langues puis demandent une présentation via LIA ARMONÍA.","portalBody2":"Vous choisissez les contenus : présentation, régions, services, portfolio, tarifs indicatifs facultatifs et avis vérifiables. Nous créons une présentation harmonisée que vous validez avant publication.","portalNote":"Lancement de la Founding Collection le 15 janvier 2027. Nous recueillons et préparons les profils dès maintenant, avant validation individuelle et publication commune. Aucun frais de référencement. Les mises en relation font l'objet d'un accord distinct.","portalLink":"Découvrir le Planner Edit ↗"},"es":{"nav":"COLABORACIONES PRIVADAS / WEDDING PLANNERS","eyebrow":"LIA ARMONÍA / INVITACIÓN PERSONAL","hero":"Tu próximo cliente.<br><em>Nuestra presentación.</em>","heroDesc":"Estamos creando una Wedding Planner Edit para mostrar estudios locales seleccionados a parejas internacionales. Podrán descubrir tu trabajo por destino y solicitar una presentación a través de LIA ARMONÍA. Tú gestionas los clientes y la planificación; nuestros servicios de diseño son completamente opcionales.","cta":"Descubre la oportunidad ↓","strip":"PAREJAS INTERNACIONALES · EXPERIENCIA LOCAL · COLABORACIÓN CREATIVA","s1n":"01 / LA OPORTUNIDAD","s1":"La pareja adecuada.<br><em>El planner ideal.</em>","s1p":"LIA ARMONÍA recibe consultas de parejas de Estados Unidos y otros países que organizan bodas en Europa y distintos destinos. Algunos proyectos cuentan con presupuestos totales de seis cifras. Buscamos planners locales con experiencia para la planificación y producción.","s1sub":"Cada presentación se estudia según destino, necesidades, estilo y presupuesto. Las consultas no garantizan reservas.","stat1":"EE. UU. Y EL MUNDO","stat1b":"Consultas para bodas de destino","stat2":"PLANNERS LOCALES","stat2b":"Experiencia en el destino","stat3":"SELECTIVO","stat3b":"Presentaciones personales y adecuadas","s2n":"03 / CÓMO COLABORAMOS","s2":"Nosotros diseñamos.<br><em>Tú lo haces realidad.</em>","s2p":"LIA ARMONÍA crea la dirección artística, el diseño espacial y visualizaciones realistas adaptadas al venue, para que las parejas puedan imaginar su celebración.","s2p2":"El planner local evalúa la viabilidad, adapta los detalles con nosotros, coordina proveedores y dirige la planificación y ejecución. Las visualizaciones no garantizan una reproducción idéntica.","role1":"LIA ARMONÍA","role1b":"Dirección creativa · Diseño · Visualización","role2":"PLANNER LOCAL","role2b":"Viabilidad · Venue · Proveedores · Ejecución","role3":"JUNTOS","role3b":"Una visión coordinada y realizable","s3n":"04 / MÁS ALLÁ DEL PERFIL","s3":"Más visibilidad.<br><em>Más oportunidades.</em>","p1":"Presentaciones personales de clientes","p1b":"Cuando una pareja descubre o solicita tu estudio, revisamos su consulta y podemos presentártela con su autorización. Tú mantienes tus tarifas, relación con el cliente y elección de proyectos.","p2":"Diseño opcional con tarifas de partner","p2b":"Solo si lo deseas, creamos conceptos, visualizaciones y dirección creativa para tus propios clientes a precios preferenciales. Son servicios totalmente opcionales, presupuestados por separado y nunca obligatorios para figurar en el portal.","s4n":"05 / OPORTUNIDAD COMERCIAL","s4":"Comisión solo<br><em>por resultados.</em>","rateLabel":"COMISIÓN PROPUESTA / HONORARIOS DE PLANNING","s4p":"Por cada nuevo cliente presentado por LIA ARMONÍA que contrate tus servicios, proponemos un 15 % de los honorarios netos de planificación efectivamente cobrados, no del presupuesto total de la boda. Se excluyen venue, proveedores, impuestos y gastos por cuenta del cliente.","s4small":"Sin cuota inicial ni exclusividad. Atribución, pagos y divulgaciones necesarias se acordarán por escrito conforme a las reglas locales. No se garantizan reservas.","s5n":"06 / TU INVITACIÓN","s5":"Creemos algo<br><em>extraordinario.</em>","s5p":"Me encantaría considerar tu estudio para nuestra primera selección. Si te interesa, envíame tu correo electrónico y te compartiré el enlace para subir el perfil, la lista de materiales, el calendario del lanzamiento del 15 de enero y los siguientes pasos. Podrás aprobar tu perfil antes de publicarlo. Los servicios de diseño son opcionales.","mail":"Hablemos de colaboración ↗","foot":"INVITACIÓN PRIVADA · LIA ARMONÍA","alt":"Concepto arquitectónico de LIA ARMONÍA, no fotografía de una boda real.","portalN":"02 / TU PERFIL EDITORIAL","portalTitle":"Tu trabajo.<br><em>En primer plano.</em>","portalBody":"Tu estudio puede formar parte de nuestra Wedding Planner Collection junto a la Venue Edit. Las parejas descubren y comparan planners aprobados por país, región, servicios e idiomas, y pueden solicitar una presentación a través de LIA ARMONÍA.","portalBody2":"Tú decides qué compartir: historia, destinos, servicios, portfolio, precios orientativos opcionales y reseñas verificables. Lo unificamos en un perfil editorial elegante para que lo apruebes antes de publicarlo.","portalNote":"Lanzamiento de la Founding Collection: 15 de enero de 2027. Recopilamos y revisamos los perfiles antes del lanzamiento conjunto, siempre con aprobación individual. Sin cuota de publicación. Las referencias se acuerdan por separado.","portalLink":"Explorar Planner Edit ↗"}};function setLanguage(lang){const l=Object.prototype.hasOwnProperty.call(translations,lang)?lang:'en',strings=translations[l];document.documentElement.lang=l;document.querySelectorAll('[data-key]').forEach(el=>{const key=el.getAttribute('data-key');if(Object.prototype.hasOwnProperty.call(strings,key)){if(['hero','s1','s2','s3','s4','s5','portalTitle'].includes(key))el.innerHTML=strings[key];else el.textContent=strings[key]}});document.getElementById('navLabel').textContent=strings.nav;document.getElementById('language').value=l;try{localStorage.setItem('lia-planner-proposal-language',l)}catch(e){}}const sel=document.getElementById('language');sel.addEventListener('change',e=>setLanguage(e.target.value));let initial='en';try{initial=localStorage.getItem('lia-planner-proposal-language')||(navigator.language||'en').slice(0,2)}catch(e){}setLanguage(initial);</script></body></html>
