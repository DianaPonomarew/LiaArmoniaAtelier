<script>const translations={"en":{"nav":"PRIVATE PLANNER PARTNERSHIPS","eyebrow":"LIA ARMONÍA / A PRIVATE INVITATION","hero":"Your expertise.<br><em>Our vision.</em>","heroDesc":"For extraordinary destination weddings, great design needs exceptional people on the ground. We are inviting a select circle of local wedding planners into our international creative network.","cta":"Explore the opportunity ↓","strip":"INTERNATIONAL COUPLES · LOCAL EXPERTISE · DESIGN-LED PARTNERSHIPS","s1n":"01 / THE OPPORTUNITY","s1":"Our clients.<br><em>Your destination.</em>","s1p":"LIA ARMONÍA receives enquiries from couples in the United States and beyond who are planning destination weddings in Europe and other remarkable places. Some projects involve substantial six-figure overall budgets. We look for experienced local planners who can guide these couples through planning and production.","s1sub":"Every introduction is considered individually, according to destination, project needs, style and budget. Enquiries are not guaranteed bookings.","stat1":"U.S. & GLOBAL","stat1b":"Destination wedding enquiries","stat2":"LOCAL","stat2b":"Expertise at the destination","stat3":"SELECTIVE","stat3b":"Personal, qualified introductions","s2n":"02 / OUR ROLE","s2":"We imagine.<br><em>You bring it to life.</em>","s2p":"LIA ARMONÍA develops the creative direction: an architecture-led wedding concept, spatial design, mood and realistic venue-specific visualizations. We give couples a clear picture of their celebration before it happens.","s2p2":"When a local partner is involved, we share the agreed design direction and collaborate as needed. You bring your on-the-ground knowledge, refine the concept for what is feasible at the venue, coordinate local suppliers and manage planning and execution. The couple's vision remains central — practical adaptations happen together, never as a promise of an identical real-life result.","role1":"LIA ARMONÍA","role1b":"Creative direction · Spatial concepts · Visualization","role2":"LOCAL PLANNER","role2b":"Feasibility · Venue coordination · Vendors · Execution","role3":"TOGETHER","role3b":"One aligned design, adapted to the real space","s3n":"03 / TWO WAYS TO COLLABORATE","s3":"A partnership,<br><em>with room to grow.</em>","p1":"Qualified client introductions","p1b":"When a U.S. or international couple needs a planner in your destination, we can introduce you directly if the project is a fit. You set your own planning fees, lead your client relationship and decide whether to accept the booking.","p2":"Preferred design services for your clients","p2b":"For your own weddings, LIA ARMONÍA can create bespoke concepts, venue visualizations and creative design direction at preferential partner rates. These services are optional, quoted per project and separate from referral arrangements.","s4n":"04 / THE COMMERCIAL OPPORTUNITY","s4":"A fee for<br><em>results.</em>","rateLabel":"PROPOSED REFERRAL COMMISSION / PLANNING FEES","s4p":"For a new client personally introduced by LIA ARMONÍA who books your planning services, our proposed referral commission is 15% of the net planning fees actually received by your studio — not 15% of the total wedding budget. Venue fees, third-party suppliers, taxes and pass-through costs are excluded.","s4small":"No upfront joining fee. Non-exclusive collaboration. Referral eligibility, attribution, payment timing and any required client disclosures are agreed in writing beforehand; terms are subject to applicable local rules. No guaranteed bookings or lead volume.","s5n":"05 / YOUR INVITATION","s5":"Let's build something<br><em>remarkable.</em>","s5p":"If your work and destination align with the couples we serve, I'd love to explore having you among our trusted local partners. Simply reply to the invitation or email your portfolio, destinations, planning packages and best contact details. We can discuss the partnership personally — no application form or commitment required.","mail":"Discuss a partnership ↗","foot":"A PRIVATE PARTNER INVITATION · LIA ARMONÍA","alt":"LIA ARMONÍA original architectural wedding design concept, not a photographed client event."},"de":{"nav":"PRIVATE PLANNER-PARTNERSCHAFTEN","eyebrow":"LIA ARMONÍA / PERSÖNLICHE EINLADUNG","hero":"Ihre Expertise.<br><em>Unsere Vision.</em>","heroDesc":"Außergewöhnliche Destination Weddings brauchen neben einer starken Designvision erfahrene Menschen vor Ort. Wir laden ausgewählte lokale Wedding Planner in unser internationales Kreativnetzwerk ein.","cta":"Partnerschaft entdecken ↓","strip":"INTERNATIONALE PAARE · LOKALE EXPERTISE · DESIGNPARTNERSCHAFTEN","s1n":"01 / DIE CHANCE","s1":"Unsere Kunden.<br><em>Ihre Destination.</em>","s1p":"LIA ARMONÍA erhält Anfragen von Paaren aus den USA und anderen Ländern, die Hochzeiten in Europa und weiteren Destinationen planen. Manche Projekte haben ein sechsstelliges Gesamtbudget. Dafür suchen wir erfahrene lokale Planner, die Planung und Umsetzung professionell begleiten.","s1sub":"Jede Vermittlung erfolgt individuell nach Destination, Anforderungen, Stil und Budget. Anfragen sind keine garantierten Buchungen.","stat1":"USA & WELTWEIT","stat1b":"Anfragen für Destination Weddings","stat2":"LOKAL","stat2b":"Expertise direkt vor Ort","stat3":"AUSGEWÄHLT","stat3b":"Persönliche passende Vermittlungen","s2n":"02 / UNSERE ROLLEN","s2":"Wir entwerfen.<br><em>Sie setzen um.</em>","s2p":"LIA ARMONÍA entwickelt die kreative Richtung: architekturbezogene Hochzeitskonzepte, Raumgestaltung, Mood und realistische Visualisierungen für die gewählte Venue. So können Paare ihre Feier frühzeitig erleben.","s2p2":"Mit einem lokalen Partner stimmen wir die Designvision ab. Sie prüfen die praktische Machbarkeit, passen Details in Abstimmung mit uns an, koordinieren lokale Dienstleister und verantworten Planung und Umsetzung. Es geht nicht um eine Garantie, dass Visualisierungen eins zu eins realisierbar sind.","role1":"LIA ARMONÍA","role1b":"Creative Direction · Raumkonzepte · Visualisierung","role2":"LOKALER PLANNER","role2b":"Machbarkeit · Venue · Dienstleister · Umsetzung","role3":"GEMEINSAM","role3b":"Ein stimmiges Design, das vor Ort funktioniert","s3n":"03 / ZWEI WEGE DER ZUSAMMENARBEIT","s3":"Eine Partnerschaft.<br><em>Viele Möglichkeiten.</em>","p1":"Passende Kundenvermittlung","p1b":"Sucht ein US-amerikanisches oder internationales Paar einen Planner in Ihrer Region, können wir Sie bei passender Anfrage direkt vorstellen. Sie bestimmen Ihre Honorare, führen die Kundenbeziehung selbst und entscheiden über jede Buchung.","p2":"Vergünstigte Designs für Ihre Kunden","p2b":"Für Ihre eigenen Hochzeitsprojekte erstellt LIA ARMONÍA auf Wunsch individuelle Konzepte, Venue-Visualisierungen und Creative Direction zu vergünstigten Partnerkonditionen. Optional, individuell angeboten und unabhängig von Vermittlungen.","s4n":"04 / DAS PARTNERSCHAFTSMODELL","s4":"Provision nur<br><em>bei Erfolg.</em>","rateLabel":"VORGESCHLAGENE VERMITTLUNGSPROVISION / PLANUNGSHONORAR","s4p":"Bei einem neuen, durch LIA ARMONÍA vermittelten Kunden, der Ihre Planungsleistungen bucht, schlagen wir 15 % des tatsächlich vereinnahmten Netto-Planungshonorars vor – ausdrücklich nicht des gesamten Hochzeitsbudgets. Venue-Kosten, externe Dienstleister, Steuern und durchlaufende Posten sind ausgenommen.","s4small":"Keine Aufnahmegebühr. Keine Exklusivität. Vermittlung, Nachweis, Zahlung und erforderliche Offenlegung werden vorab schriftlich und im Einklang mit den jeweiligen rechtlichen Vorgaben geregelt. Keine garantierten Buchungen.","s5n":"05 / PERSÖNLICHE EINLADUNG","s5":"Lassen Sie uns<br><em>etwas bewegen.</em>","s5p":"Wenn Ihre Arbeitsweise zu unseren Paaren passt, würde ich Sie sehr gerne als lokalen Partner kennenlernen. Senden Sie mir einfach Ihr Portfolio, Ihre Destinationen, Leistungen und Kontaktdaten per E-Mail oder antworten Sie direkt auf meine Nachricht. Ohne Formular und ohne Verpflichtung.","mail":"Partnerschaft besprechen ↗","foot":"PRIVATE PARTNERSCHAFTSEINLADUNG · LIA ARMONÍA","alt":"Architektonisches Designkonzept von LIA ARMONÍA, keine Fotografie eines realen Events."},"it":{"nav":"PARTNERSHIP PRIVATE PER WEDDING PLANNER","eyebrow":"LIA ARMONÍA / UN INVITO PERSONALE","hero":"La vostra esperienza.<br><em>La nostra visione.</em>","heroDesc":"I matrimoni di destinazione straordinari richiedono una visione creativa e professionisti eccezionali sul posto. Invitiamo una selezione di wedding planner locali nel nostro network internazionale.","cta":"Scopri l'opportunità ↓","strip":"COPPIE INTERNAZIONALI · COMPETENZA LOCALE · PARTNERSHIP CREATIVE","s1n":"01 / L'OPPORTUNITÀ","s1":"I nostri clienti.<br><em>La vostra destinazione.</em>","s1p":"LIA ARMONÍA riceve richieste da coppie statunitensi e internazionali che organizzano matrimoni in Europa e altrove. Alcuni progetti prevedono budget complessivi a sei cifre. Cerchiamo wedding planner locali esperti per la pianificazione e la produzione.","s1sub":"Ogni presentazione viene valutata in base a destinazione, esigenze, stile e budget. Le richieste non garantiscono prenotazioni.","stat1":"USA & MONDO","stat1b":"Richieste per destination wedding","stat2":"LOCALE","stat2b":"Competenza sul territorio","stat3":"SELETTIVO","stat3b":"Presentazioni personali e mirate","s2n":"02 / I NOSTRI RUOLI","s2":"Noi immaginiamo.<br><em>Voi realizzate.</em>","s2p":"LIA ARMONÍA crea la direzione artistica, il design degli spazi e visualizzazioni realistiche della location, per dare forma alla visione degli sposi.","s2p2":"I planner locali valutano la fattibilità, adattano con noi il progetto alle condizioni reali, coordinano i fornitori e gestiscono pianificazione e realizzazione. Le visualizzazioni non sono una promessa di riproduzione identica.","role1":"LIA ARMONÍA","role1b":"Direzione creativa · Design · Visualizzazione","role2":"PLANNER LOCALE","role2b":"Fattibilità · Location · Fornitori · Realizzazione","role3":"INSIEME","role3b":"Una visione condivisa e realizzabile","s3n":"03 / DUE MODI DI COLLABORARE","s3":"Una partnership.<br><em>Più possibilità.</em>","p1":"Presentazioni a clienti qualificati","p1b":"Quando una coppia americana o internazionale cerca un planner nella vostra destinazione, possiamo mettervi direttamente in contatto. Restano vostri tariffe, rapporto con il cliente e decisione di accettare il progetto.","p2":"Design a tariffe partner per i vostri clienti","p2b":"Per i vostri matrimoni, LIA ARMONÍA può creare concept, visualizzazioni e direzione creativa su misura a condizioni agevolate, con preventivo dedicato. Servizio facoltativo e separato dalle segnalazioni.","s4n":"04 / L'OPPORTUNITÀ COMMERCIALE","s4":"Una commissione<br><em>sui risultati.</em>","rateLabel":"COMMISSIONE PROPOSTA / COMPENSI DI PLANNING","s4p":"Per ogni nuovo cliente presentato da LIA ARMONÍA che prenota i vostri servizi di planning, proponiamo il 15% dei compensi netti effettivamente incassati dallo studio, non del budget totale del matrimonio. Sono esclusi location, fornitori esterni, imposte e spese anticipate per conto del cliente.","s4small":"Nessuna quota d'ingresso né esclusiva. Attribuzione, pagamento e comunicazioni richieste saranno definiti per iscritto, nel rispetto delle normative locali. Nessuna garanzia di prenotazioni.","s5n":"05 / IL VOSTRO INVITO","s5":"Creiamo qualcosa<br><em>di speciale.</em>","s5p":"Mi piacerebbe conoscere il vostro lavoro e valutare una collaborazione. Potete rispondere al mio messaggio o inviare portfolio, destinazioni, servizi e contatti via email. Nessun modulo o impegno.","mail":"Parliamo di partnership ↗","foot":"INVITO PRIVATO · LIA ARMONÍA","alt":"Concept di wedding design di LIA ARMONÍA; non è una fotografia di un evento reale."},"fr":{"nav":"PARTENARIATS PRIVÉS / WEDDING PLANNERS","eyebrow":"LIA ARMONÍA / INVITATION PRIVÉE","hero":"Votre expertise.<br><em>Notre vision.</em>","heroDesc":"Les mariages de destination extraordinaires associent une direction créative forte à des experts locaux d'exception. Nous invitons des wedding planners sélectionnés dans notre réseau international.","cta":"Découvrir l'opportunité ↓","strip":"COUPLES INTERNATIONAUX · EXPERTISE LOCALE · PARTENARIATS CRÉATIFS","s1n":"01 / L'OPPORTUNITÉ","s1":"Nos clients.<br><em>Votre destination.</em>","s1p":"LIA ARMONÍA reçoit des demandes de couples américains et internationaux qui organisent des mariages en Europe et ailleurs. Certains projets disposent d'un budget global à six chiffres. Nous recherchons des wedding planners locaux expérimentés.","s1sub":"Chaque mise en relation dépend de la destination, des besoins, du style et du budget. Les demandes ne garantissent aucune réservation.","stat1":"ÉTATS-UNIS & MONDE","stat1b":"Demandes de mariages de destination","stat2":"LOCAL","stat2b":"Expertise sur place","stat3":"SÉLECTIF","stat3b":"Mises en relation personnalisées","s2n":"02 / NOS RÔLES","s2":"Nous imaginons.<br><em>Vous réalisez.</em>","s2p":"LIA ARMONÍA conçoit la direction artistique, les espaces et des visualisations réalistes adaptées au lieu de réception afin de donner vie au projet des futurs mariés.","s2p2":"Le partenaire local vérifie la faisabilité, adapte les détails avec nous, coordonne les prestataires et dirige la planification et la réalisation. Les visualisations ne constituent pas une garantie de reproduction à l'identique.","role1":"LIA ARMONÍA","role1b":"Direction créative · Design · Visualisations","role2":"PLANNER LOCAL","role2b":"Faisabilité · Lieu · Prestataires · Réalisation","role3":"ENSEMBLE","role3b":"Une vision cohérente et réalisable","s3n":"03 / DEUX FORMES DE COLLABORATION","s3":"Un partenariat.<br><em>Plusieurs possibilités.</em>","p1":"Présentation de clients qualifiés","p1b":"Lorsqu'un couple américain ou international recherche un planner dans votre région, nous pouvons vous mettre en relation. Vous gardez la maîtrise de vos tarifs, de vos contrats et de la relation client.","p2":"Design à tarif partenaire pour vos clients","p2b":"Pour vos propres mariages, LIA ARMONÍA peut créer des concepts, visualisations et directions créatives sur mesure à des tarifs préférentiels, sur devis. Service facultatif et indépendant des recommandations.","s4n":"04 / LE MODÈLE COMMERCIAL","s4":"Une commission<br><em>au résultat.</em>","rateLabel":"COMMISSION PROPOSÉE / HONORAIRES DE PLANNING","s4p":"Pour un nouveau client présenté par LIA ARMONÍA qui réserve vos services, nous proposons 15 % des honoraires nets de planning effectivement encaissés, et non du budget total du mariage. Location, prestataires tiers, taxes et débours sont exclus.","s4small":"Aucun droit d'entrée, aucune exclusivité. Attribution, paiement et informations à communiquer seront convenus par écrit dans le respect des règles locales. Aucune réservation garantie.","s5n":"05 / VOTRE INVITATION","s5":"Créons quelque chose<br><em>d'exceptionnel.</em>","s5p":"Je serais ravie de découvrir votre travail et d'échanger sur une collaboration. Répondez à mon invitation ou envoyez portfolio, destinations, services et coordonnées par email. Aucun formulaire ni engagement.","mail":"Parlons partenariat ↗","foot":"INVITATION PRIVÉE · LIA ARMONÍA","alt":"Concept architectural créé par LIA ARMONÍA, et non photographie d'un mariage réel."},"es":{"nav":"COLABORACIONES PRIVADAS / WEDDING PLANNERS","eyebrow":"LIA ARMONÍA / INVITACIÓN PERSONAL","hero":"Tu experiencia.<br><em>Nuestra visión.</em>","heroDesc":"Las bodas de destino extraordinarias necesitan una visión creativa y excelentes profesionales locales. Invitamos a una selección de wedding planners a nuestra red internacional.","cta":"Descubre la oportunidad ↓","strip":"PAREJAS INTERNACIONALES · EXPERIENCIA LOCAL · COLABORACIÓN CREATIVA","s1n":"01 / LA OPORTUNIDAD","s1":"Nuestros clientes.<br><em>Tu destino.</em>","s1p":"LIA ARMONÍA recibe consultas de parejas de Estados Unidos y otros países que organizan bodas en Europa y distintos destinos. Algunos proyectos cuentan con presupuestos totales de seis cifras. Buscamos planners locales con experiencia para la planificación y producción.","s1sub":"Cada presentación se estudia según destino, necesidades, estilo y presupuesto. Las consultas no garantizan reservas.","stat1":"EE. UU. Y EL MUNDO","stat1b":"Consultas para bodas de destino","stat2":"LOCAL","stat2b":"Experiencia en el destino","stat3":"SELECTIVO","stat3b":"Presentaciones personales y adecuadas","s2n":"02 / NUESTRO PAPEL","s2":"Nosotros diseñamos.<br><em>Tú lo haces realidad.</em>","s2p":"LIA ARMONÍA crea la dirección artística, el diseño espacial y visualizaciones realistas adaptadas al venue, para que las parejas puedan imaginar su celebración.","s2p2":"El planner local evalúa la viabilidad, adapta los detalles con nosotros, coordina proveedores y dirige la planificación y ejecución. Las visualizaciones no garantizan una reproducción idéntica.","role1":"LIA ARMONÍA","role1b":"Dirección creativa · Diseño · Visualización","role2":"PLANNER LOCAL","role2b":"Viabilidad · Venue · Proveedores · Ejecución","role3":"JUNTOS","role3b":"Una visión coordinada y realizable","s3n":"03 / DOS FORMAS DE COLABORAR","s3":"Una colaboración.<br><em>Más oportunidades.</em>","p1":"Presentaciones a clientes cualificados","p1b":"Cuando una pareja estadounidense o internacional busca un planner en tu destino, podemos presentarte directamente. Mantienes el control de tus tarifas, contratos y relación con el cliente.","p2":"Diseño preferencial para tus clientes","p2b":"Para tus propios proyectos, LIA ARMONÍA puede crear conceptos, visualizaciones y dirección creativa a precios especiales para partners, con presupuestos personalizados. Es opcional e independiente de las referencias.","s4n":"04 / OPORTUNIDAD COMERCIAL","s4":"Comisión solo<br><em>por resultados.</em>","rateLabel":"COMISIÓN PROPUESTA / HONORARIOS DE PLANNING","s4p":"Por cada nuevo cliente presentado por LIA ARMONÍA que contrate tus servicios, proponemos un 15 % de los honorarios netos de planificación efectivamente cobrados, no del presupuesto total de la boda. Se excluyen venue, proveedores, impuestos y gastos por cuenta del cliente.","s4small":"Sin cuota inicial ni exclusividad. Atribución, pagos y divulgaciones necesarias se acordarán por escrito conforme a las reglas locales. No se garantizan reservas.","s5n":"05 / TU INVITACIÓN","s5":"Creemos algo<br><em>extraordinario.</em>","s5p":"Me encantaría conocer tu trabajo y explorar una colaboración. Responde a mi mensaje o envía tu portfolio, destinos, servicios y datos de contacto por email. Sin formularios ni compromisos.","mail":"Hablemos de colaboración ↗","foot":"INVITACIÓN PRIVADA · LIA ARMONÍA","alt":"Concepto arquitectónico de LIA ARMONÍA, no fotografía de una boda real."}};function setLanguage(lang){const l=Object.prototype.hasOwnProperty.call(translations,lang)?lang:'en',strings=translations[l];document.documentElement.lang=l;document.querySelectorAll('[data-key]').forEach(el=>{const key=el.getAttribute('data-key');if(Object.prototype.hasOwnProperty.call(strings,key)){if(['hero','s1','s2','s3','s4','s5'].includes(key))el.innerHTML=strings[key];else el.textContent=strings[key]}});document.getElementById('navLabel').textContent=strings.nav;document.getElementById('language').value=l;try{localStorage.setItem('lia-planner-proposal-language',l)}catch(e){}}const sel=document.getElementById('language');sel.addEventListener('change',e=>setLanguage(e.target.value));let initial='en';try{initial=localStorage.getItem('lia-planner-proposal-language')||(navigator.language||'en').slice(0,2)}catch(e){}setLanguage(initial);</script></body></html>
